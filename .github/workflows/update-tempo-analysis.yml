name: Update Toronto Tempo rotation-decay analysis

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 2"  # weekly, Tuesdays

concurrency:
  group: update-tempo-analysis
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build analysis
        run: |
          python build_tempo_analysis.py \
            --team-id 1611661332 \
            --season 2026 \
            --template template.html \
            --out docs/index.html \
            --data-dir data

      - name: Commit and push
        run: |
          git config user.name "jordanngo205"
          git config user.email "113134291+jordanngo205@users.noreply.github.com"
          git add -A data docs
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: refresh Toronto Tempo rotation-decay analysis"
            git pull --rebase --autostash origin main || {
              echo "Rebase hit a conflict — leaving branch alone; retry the run."
              exit 0
            }
            git push origin HEAD:main
          fi
