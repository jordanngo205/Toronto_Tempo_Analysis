name: Scrape WNBA Toronto Tempo

on:
  workflow_dispatch:

concurrency:
  group: scrape-wnba-tempo
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests

      - name: Scrape Toronto Tempo 2026 season
        run: |
          python wnba_scrape.py \
            --team-id 1611661332 \
            --team-name "Toronto Tempo" \
            --season 2026 \
            --name "Toronto Tempo 2026"

      - name: Commit and push
        run: |
          git config user.name "jordanngo205"
          git config user.email "113134291+jordanngo205@users.noreply.github.com"
          git add -A "Toronto Tempo 2026"
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: scrape Toronto Tempo 2026 WNBA season data"
            git pull --rebase --autostash origin main || {
              echo "Rebase hit a conflict — leaving branch alone; retry the run."
              exit 0
            }
            git push origin HEAD:main
          fi
